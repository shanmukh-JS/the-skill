{% extends "base.html" %}

{% block title %}Page Not Found - Skill Exchange Platform{% endblock %}

{% block content %}
<div class="text-center py-5 my-5">
  <div class="display-1 fw-bold text-primary mb-2">404</div>
  <h2 class="fw-bold mb-3">Page Not Found</h2>
  <p class="text-muted mb-4 mx-auto" style="max-width: 500px;">
    The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
  </p>
  <a href="{{ url_for('main.index') }}" class="btn btn-primary btn-lg px-4 me-2">
    <i class="bi bi-house me-1"></i> Return Home
  </a>
  <a href="{{ url_for('search.search_skills') }}" class="btn btn-outline-secondary btn-lg px-4">
    <i class="bi bi-search me-1"></i> Explore Skills
  </a>
</div>
{% endblock %}
