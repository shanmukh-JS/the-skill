{% extends "base.html" %}

{% block title %}Server Error - Skill Exchange Platform{% endblock %}

{% block content %}
<div class="text-center py-5 my-5">
  <div class="display-1 fw-bold text-danger mb-2">500</div>
  <h2 class="fw-bold mb-3">Internal Server Error</h2>
  <p class="text-muted mb-4 mx-auto" style="max-width: 500px;">
    An unexpected error occurred on our server. Our team has been notified. Please try again in a few moments.
  </p>
  <a href="{{ url_for('main.index') }}" class="btn btn-primary btn-lg px-4">
    <i class="bi bi-house me-1"></i> Return Home
  </a>
</div>
{% endblock %}
